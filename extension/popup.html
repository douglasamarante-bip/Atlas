<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><style>
body{width:320px;margin:0;padding:14px;background:#0a0f1c;color:#e8edf7;font:13px system-ui,sans-serif}
h1{font-size:15px;margin:0 0 10px}h1 b{color:#ff7a1a}
input,button{width:100%;box-sizing:border-box;margin:4px 0;padding:8px;border-radius:8px;border:1px solid #1f2b45;background:#111a2e;color:#e8edf7;font:inherit}
button{cursor:pointer}.pri{background:#ff7a1a;border-color:#ff7a1a;color:#fff;font-weight:600}
.row{display:flex;gap:6px}.mu{color:#8393b3;font-size:12px}label{display:block;margin:6px 0}label input{width:auto;margin-right:6px}
</style></head><body>
<h1>ADS <b>RADAR</b> · Captura</h1>
<div class="mu">Abra a Biblioteca de Anúncios da Meta ou o Centro de Transparência do Google com os resultados na tela.</div>
<input id="nome" placeholder="Nome do alvo (ex.: @marca)">
<button class="pri" id="s1">Capturar (rolando a página)</button>
<button id="s0">Capturar só o que está visível</button>
<label><input type="checkbox" id="add" checked>Somar com capturas anteriores (Meta + Google)</label>
<div id="n" class="mu"></div><div id="st" class="mu"></div>
<div class="row"><button id="dl">Baixar CSV</button><button id="cp">Copiar CSV</button><button id="clr">Limpar</button></div>
<input id="url" placeholder="URL do seu dashboard (https://meusite.netlify.app)">
<button class="pri" id="send">Enviar ao dashboard</button>
<script src="popup.js"></script></body></html>
